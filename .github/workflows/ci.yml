name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "v-sb-*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify JVM and Android targets
        run: |
          chmod +x gradlew
          ./gradlew \
            :core:jvmTest \
            :ui:jvmTest \
            :roomStore:jvmTest \
            :androidMedia:testDebugUnitTest \
            :androidBilling:testDebugUnitTest \
            :androidBilling:assembleDebug \
            :driveSync:jvmTest \
            :driveSync:compileAndroidMain \
            :driveSync:compileKotlinWasmJs \
            :androidApp:assembleDebug \
            :androidApp:lintDebug \
            --no-daemon \
            --console=plain

      - name: Test IndexedDB in headless Chrome
        run: ./gradlew :webStore:wasmJsBrowserTest --no-daemon --console=plain

      - name: Test browser speech in headless Chrome
        run: ./gradlew :webSpeech:wasmJsBrowserTest --no-daemon --console=plain

      - name: Build production web distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --console=plain

      - name: Upload Android APK and lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          if-no-files-found: warn
          path: |
            AutoPrompter-v*.apk
            androidApp/build/reports/lint-results-debug.html

      - name: Upload web distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-production
          if-no-files-found: warn
          path: webApp/build/dist/wasmJs/productionExecutable/

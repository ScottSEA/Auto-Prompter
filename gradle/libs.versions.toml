# Versions from the official Kotlin/KMP-App-Template baseline (commit 63ff248c):
# Kotlin 2.3.21, Compose Multiplatform 1.11.0, AGP 9.0.1, Gradle wrapper 9.3.1.
[versions]
agp = "9.0.1"
android-compileSdk = "36"
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.10.0"
composeMultiplatform = "1.11.0"
kotlin = "2.3.21"
# kotlinx.serialization runtime. 1.11.0 is the latest stable release and was built with the
# Kotlin 2.3.20 multiplatform plugin (per its kotlin-tooling-metadata), matching this project's
# Kotlin 2.3.21 line, so the bundled serialization compiler plugin and this runtime agree.
kotlinxSerialization = "1.11.0"
# kotlinx.coroutines runtime + test. 1.11.0 is the latest stable release on Maven Central
# (maven-metadata <release>1.11.0</release>, published 2026-05-07) and publishes a wasm-js target
# (kotlinx-coroutines-core-wasm-js / kotlinx-coroutines-test-wasm-js 1.11.0 klibs exist). Its
# kotlin-tooling-metadata.json reports it was built with the Kotlin multiplatform plugin 2.2.20;
# Kotlin's stable 2.x library metadata is forward-compatible, so this project's 2.3.21 compiler
# consumes it across jvm, androidLibrary, and wasmJs (proven by :core/:ui/:webApp builds).
kotlinxCoroutines = "1.11.0"
material3 = "1.11.0-alpha07"
# Room 3.0.0 is the first stable release of the androidx.room3 line (stable 2026-07-01), a
# KSP-only, coroutines-first, SQLiteDriver-backed rewrite. See
# https://developer.android.com/jetpack/androidx/releases/room3 .
room = "3.0.0"
# AndroidX SQLite 2.7.0 (stable) provides BundledSQLiteDriver, the driver Room3 recommends for
# consistent behavior across JVM host tests and Android. See
# https://developer.android.com/jetpack/androidx/releases/sqlite .
androidxSqlite = "2.7.0"
# KSP 2.3.10 is the latest stable KSP2 release (published 2026-07-09, decoupled semver). KSP2 is
# not pinned to a single Kotlin version; this project's Kotlin 2.3.21 build resolves and runs it.
ksp = "2.3.10"
# Juul com.juul.indexeddb:core 0.12.0 (Apache-2.0) is a small coroutine wrapper over the browser
# IndexedDB API. 0.12.0 (published 2026, built for the Kotlin 2.3.x line) is the first release with
# Kotlin/Wasm support: it drops `dynamic` for `JsAny`, adds a `core-wasm-js` artifact, and exposes
# suspend transaction wrappers (openDatabase/writeTransaction/transaction) with auto-commit-safe
# scoped operations. It is the durable web (wasmJs) DocumentStore backend; see :webStore and
# https://github.com/JuulLabs/indexeddb . It resolves from Maven Central.
indexeddb = "0.12.0"
# Official sherpa-onnx Android release. Maven Central does not currently publish the Android AAR;
# the upstream Android demo consumes this exact tag from JitPack. The repository is content-filtered
# to com.github.k2-fsa in :androidMedia so no unrelated dependency can resolve there.
sherpaOnnx = "v1.13.4"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtimeCompose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }
juul-indexeddb-core = { module = "com.juul.indexeddb:core", version.ref = "indexeddb" }
sherpa-onnx-android = { module = "com.github.k2-fsa:sherpa-onnx", version.ref = "sherpaOnnx" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidxRoom = { id = "androidx.room3", version.ref = "room" }
